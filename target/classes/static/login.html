<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Flavor Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

    <!-- Simple Nav -->
    <nav class="navbar navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-fire text-warning fs-3"></i>
                <span>Flavor</span><span class="text-white">Spot</span>
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm text-white"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
        </div>
    </nav>

    <!-- Login Container -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card-custom p-4 p-md-5 shadow-lg">
                    <div class="text-center mb-4">
                        <span class="hero-badge"><i class="bi bi-shield-lock me-1"></i>Secure Portal</span>
                        <h2 class="fw-bold text-white mb-1">Welcome Back</h2>
                        <p class="text-secondary small">Access your reservations, food orders, and member perks</p>
                    </div>

                    <!-- 1-Click Demo Credentials Chip -->
                    <div class="p-3 bg-dark rounded-3 border border-secondary border-opacity-25 mb-4">
                        <div class="small fw-bold text-warning mb-2"><i class="bi bi-lightning-charge-fill me-1"></i>Quick Placement / Demo Fill:</div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary text-white w-50" onclick="fillDemo('customer')">
                                <i class="bi bi-person me-1"></i>Customer
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-warning w-50" onclick="fillDemo('admin')">
                                <i class="bi bi-shield-shaded me-1"></i>Admin
                            </button>
                        </div>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-surface-elevated text-secondary border-secondary border-opacity-25"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control form-control-custom" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-surface-elevated text-secondary border-secondary border-opacity-25"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control form-control-custom" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div id="login-error" class="alert alert-danger py-2 small" style="display: none;"></div>

                        <button type="submit" id="login-submit-btn" class="btn btn-gold w-100 py-2 mb-3">
                            <span id="login-btn-text">Sign In</span>
                            <span id="login-btn-spinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                        </button>
                    </form>

                    <div class="text-center text-secondary small">
                        Don't have an account yet? <a href="register.html" class="text-warning text-decoration-none fw-bold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-secondary small">
        &copy; 2026 Flavor Spot.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function fillDemo(type) {
            if (type === 'customer') {
                document.getElementById('email').value = 'john.doe@example.com';
                document.getElementById('password').value = 'admin123';
            } else {
                document.getElementById('email').value = 'admin@flavorspot.com';
                document.getElementById('password').value = 'admin123';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('login-error');
            const btnText = document.getElementById('login-btn-text');
            const btnSpinner = document.getElementById('login-btn-spinner');

            errBox.style.display = 'none';
            btnText.textContent = 'Verifying...';
            btnSpinner.style.display = 'inline-block';

            try {
                const res = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                Auth.setUser(res.data);
                showToast('Welcome back, ' + res.data.fullName + '!', 'success');

                setTimeout(() => {
                    if (res.data.role === 'ROLE_ADMIN') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 700);
            } catch (err) {
                errBox.textContent = err.message || 'Invalid credentials.';
                errBox.style.display = 'block';
                btnText.textContent = 'Sign In';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
