# ===================================================================
# Flavor Spot - Application Configuration
# ===================================================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=flavour_spot

# -------------------------------------------------------------------
# Option 1: H2 In-Memory Database (Default - Runs Instantly with Zero Setup!)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:flavorspot_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Option 2: MySQL Database (Uncomment when your MySQL service is started)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/flavorspot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson / JSON Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
